<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session Captured</title>
    <link rel="stylesheet" href="./styles.css" />
</head>

<body>
    <div class="container">
        <div class="login-card">
            <h1 class="title">Session captured</h1>
            <p class="subtitle" id="hint">Download the session file and place it in your omnivox data folder (the data/
                folder in the project, or your OMNIVOX_DATA_DIR)</p>

            <button class="btn-primary" id="dl-config">Download session.json</button>
        </div>
    </div>

    <script>
        const configBtn = document.getElementById('dl-config');
        
        configBtn.addEventListener('click', async () => {
            const success = await AuthData.downloadSession();
            if (success) {
                configBtn.textContent = 'session.json saved';
            }
        });
    </script>
</body>

</html>
