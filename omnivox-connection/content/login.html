<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link rel="stylesheet" href="./styles.css" />
</head>

<body>
    <div class="backdrop" aria-hidden="true">
        <i class="orbit a"></i><i class="orbit b"></i><i class="orbit c"></i>
        <i class="dot a"></i><i class="dot b"></i><i class="dot c"></i>
        <span class="keycap lea">LÉA</span>
        <span class="keycap mio">MIO</span>
        <span class="keycap mcp">/mcp</span>
        <span class="keycap rest">REST</span>
    </div>

    <main class="shell">
        <header class="brand">
            <p class="wordmark">
                <svg viewBox="0 0 100 100" aria-hidden="true">
                    <g fill="#fff">
                        <circle cx="50" cy="27" r="21" />
                        <circle cx="73.8" cy="44.3" r="21" />
                        <circle cx="64.7" cy="72.2" r="21" />
                        <circle cx="35.3" cy="72.2" r="21" />
                        <circle cx="26.2" cy="44.3" r="21" />
                        <circle cx="50" cy="52" r="24" />
                    </g>
                    <circle cx="50" cy="52" r="13.5" fill="#f5821f" />
                </svg>
                <span>Omnivox <em>MCP</em></span>
            </p>
            <p class="tagline">Your own personal bridge to Omnivox</p>
        </header>

        <form class="panel" method="POST"
            action="https://mobl.omnivox.ca/intr/Module/Identification/Login/Mobile/LN.ashx">
            <h1>Sign in</h1>
            <p class="lede">Enter your identifier and date of birth to continue</p>

            <input type="hidden" name="TypeUtilisateur" value="1" />

            <div class="field">
                <label for="identifier">Identifiant Omnivox</label>
                <input type="text" id="identifier" name="n" placeholder="12345678" required />
            </div>

            <div class="field">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" required />
            </div>

            <input type="hidden" name="d" id="dobFormatted" />
            <input type="hidden" name="L" value="ANG" />
            <input type="hidden" name="LangueAppareil" value="en-CA" />
            <input type="hidden" name="typeAppareil" value="tablet" />

            <button type="submit" class="btn">Continue</button>
        </form>
    </main>

    <script src="./login.js"></script>
</body>

</html>
