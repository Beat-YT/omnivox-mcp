services:
  omnivox-mcp:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ${OMNIVOX_DATA_DIR:-./data}:/data/omnivox
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - PORT=3000
      - TZ=America/New_York
      - OMNIVOX_DATA_DIR=/data/omnivox
      - BROWSER_SLEEP=false
      - BROWSER_REFRESH_INTERVAL=10 # recommended for session persistence
      # - MCP_SERVER_URL=https://your-public-domain.com  # Optional: enables download link generation
